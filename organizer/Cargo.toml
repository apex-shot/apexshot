[package]
name = "apexshot-organizer"
version = "0.1.0"
edition = "2021"
description = "Names, indexes, and scrubs ApexShot screenshots from their OCR text and capture context"
license = "GPL-3.0-or-later"
repository = "https://github.com/apex-shot/apexshot"
publish = false

[lib]
name = "apexshot_organizer"
path = "src/lib.rs"

# Only crates already in both the root and windows-ui lockfiles, so the
# Flatpak's vendored cargo sources keep working once the apps depend on this.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
unicode-segmentation = "1.13"
