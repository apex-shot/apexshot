name: Flatpak package build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/flatpak.yml
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - capture-overlay/**
      - flatpak/**
      - src/**
      - data/**
      - po/**
      - assets/fonts/**
      - packaging/apexshot.svg
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/flatpak.yml
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - capture-overlay/**
      - flatpak/**
      - src/**
      - data/**
      - po/**
      - assets/fonts/**
      - packaging/apexshot.svg
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and cache local test package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common

      - name: Add Flathub remote
        run: sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime, SDK, and extensions
        run: >-
          sudo flatpak install --system --assumeyes --noninteractive flathub
          org.gnome.Platform//50
          org.gnome.Sdk//50
          org.freedesktop.Platform.GL.default//25.08
          org.freedesktop.Platform.codecs-extra//25.08-extra
          org.freedesktop.Sdk.Extension.rust-stable//25.08
          org.freedesktop.Sdk.Extension.llvm20//25.08

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/org.apexshot.ApexShot.yml
          build-bundle: false
          upload-artifact: false
          cache: true
          cache-key: flatpak-${{ hashFiles('flatpak/org.apexshot.ApexShot.yml', 'flatpak/cargo-sources.json', 'Cargo.lock') }}
