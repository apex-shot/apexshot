name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # Every pull request, not only those aimed at main: this repo stacks
    # feature branches, and a base-branch filter silently skipped the layer.
  workflow_dispatch:

concurrency:
  # A newer push supersedes the run it replaced instead of queueing behind it.
  # Tags and main pushes are never cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin mutable build inputs (release hardening).
  GTK4_LAYER_SHELL_TAG: v1.1.1
  CARGO_DEB_VERSION: "3.7.0"

jobs:
  lint:
    name: Lint (rustfmt + clippy + JS + metadata)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      # The steps below need no system packages, so they run before the slow
      # apt install and clippy: a formatting slip fails in seconds instead of
      # waiting behind a multi-minute dependency install.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: GNOME extension JS syntax check
        run: |
          # The GJS-targeted unit tests in gnome-extension/tests/ rely on
          # GNOME globals (printerr, imports.gi …) and can't be run under
          # plain Node, but `node --check` is a fast safety net for the
          # extension source files themselves.
          set -euo pipefail
          for f in gnome-extension/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Installer syntax and RPM asset selection tests
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          sh -n scripts/update.sh
          bash -n scripts/fedora-install.sh
          bash -n scripts/opensuse-install.sh
          python3 scripts/test_distro_dispatch.py
          python3 scripts/test_rpm_assets.py
          python3 scripts/test_release_gate.py
          python3 scripts/test_fedora_dependencies.py

      - name: Reject nested gitlinks
        run: |
          set -euo pipefail
          gitlinks=$(git ls-files -s | awk '$1=="160000"')
          if [ -n "$gitlinks" ]; then
            echo "Nested git repositories must not be committed. Add them to .gitignore instead:"
            echo "$gitlinks"
            exit 1
          fi

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Restore cached system packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-debs
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies (clippy needs the same headers as build)
        run: |
          # apt keeps every downloaded package in its archive cache. Seed it
          # from the previous run's cache so this install makes no downloads.
          mkdir -p "$HOME/.cache/apt-debs"
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp -n "$HOME"/.cache/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install -y --fix-missing \
              libgtk-4-dev \
              libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev \
              libgstreamer-plugins-bad1.0-dev \
              libpipewire-0.3-dev \
              libtesseract-dev \
              libxkbcommon-dev \
              libx11-dev \
              libxtst-dev \
              libwayland-dev \
              libdbus-1-dev \
              meson ninja-build gobject-introspection valac \
              qtbase5-dev libqt5x11extras5-dev pkg-config \
              appstream desktop-file-utils && break
            echo "apt-get install attempt $i failed, retrying..."
            sleep 10
            sudo apt-get update
          done
          cp -n /var/cache/apt/archives/*.deb "$HOME/.cache/apt-debs/" 2>/dev/null || true

      - name: Build gtk4-layer-shell from source
        run: |
          git clone --depth 1 --branch "${GTK4_LAYER_SHELL_TAG}" \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr
          sudo ninja -C build install
          sudo ldconfig

      - name: cargo clippy
        # The codebase still carries a backlog of pre-existing clippy
        # warnings (see issue tracker). We surface them on every CI run so
        # contributors can see the noise around their changes, but we
        # don't yet fail the build on them. Once the backlog is cleared
        # this step should become `-- -D warnings`.
        run: cargo clippy --workspace --all-targets

      - name: Validate desktop + AppStream metadata
        run: scripts/validate-metadata.sh

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Deliberately no `needs: [lint]`. Clippy and the build are independent,
    # and the build is the long pole, so gating it on lint added lint's whole
    # duration (3 to 48 minutes depending on the runner queue) to every run.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore cached system packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-debs
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies
        run: |
          # apt keeps every downloaded package in its archive cache. Seed it
          # from the previous run's cache so this install makes no downloads.
          mkdir -p "$HOME/.cache/apt-debs"
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp -n "$HOME"/.cache/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install -y --fix-missing \
              libgtk-4-dev \
              libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev \
              libgstreamer-plugins-bad1.0-dev \
              gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad \
              ffmpeg \
              libpipewire-0.3-dev \
              libtesseract-dev \
              libxkbcommon-dev \
              libx11-dev \
              libxtst-dev \
              libwayland-dev \
              libdbus-1-dev \
              meson \
              ninja-build \
              gobject-introspection \
              valac \
              qtbase5-dev \
              libqt5x11extras5-dev \
              pkg-config && break
            echo "apt-get install attempt $i failed, retrying..."
            sleep 10
            sudo apt-get update
          done
          cp -n /var/cache/apt/archives/*.deb "$HOME/.cache/apt-debs/" 2>/dev/null || true

      - name: Build gtk4-layer-shell from source
        run: |
          git clone --depth 1 --branch "${GTK4_LAYER_SHELL_TAG}" \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr
          sudo ninja -C build install
          sudo ldconfig

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --jobs 2 -- --test-threads=1

  studio_release_config:
    name: Validate official Studio build configuration
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      verify_key: ${{ steps.validate.outputs.verify_key }}
      release_timestamp: ${{ steps.validate.outputs.release_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require the configured public key and pinned release marker
        id: validate
        env:
          APEXSHOT_STUDIO_VERIFY_KEY: ${{ vars.APEXSHOT_STUDIO_VERIFY_KEY }}
          APEXSHOT_STUDIO_RELEASE_TIMESTAMP: ${{ vars.APEXSHOT_STUDIO_RELEASE_TIMESTAMP }}
        run: |
          set -euo pipefail
          python3 scripts/release_gate.py validate-config \
            "$APEXSHOT_STUDIO_VERIFY_KEY" "$APEXSHOT_STUDIO_RELEASE_TIMESTAMP"
          printf 'verify_key=%s\n' "$APEXSHOT_STUDIO_VERIFY_KEY" >> "$GITHUB_OUTPUT"
          printf 'release_timestamp=%s\n' "$APEXSHOT_STUDIO_RELEASE_TIMESTAMP" >> "$GITHUB_OUTPUT"

  release:
    name: Build Debian package and GNOME extension
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [lint, ci, studio_release_config]
    if: startsWith(github.ref, 'refs/tags/')
    env:
      APEXSHOT_STUDIO_VERIFY_KEY: ${{ needs.studio_release_config.outputs.verify_key }}
      APEXSHOT_STUDIO_RELEASE_TIMESTAMP: ${{ needs.studio_release_config.outputs.release_timestamp }}
    # Oldest practical LTS baseline for shipped .debs (glibc/deps).
    # 22.04 is claimed on Pop but current GTK4 crate stack targets 24.04+.
    container:
      image: ubuntu:24.04
      env:
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        DEBIAN_FRONTEND: noninteractive
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap container tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git zip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add swap space to prevent OOM during build
        run: |
          if swapon --show | grep -q '/swapfile'; then
            echo "Swap already configured, skipping"
          else
            fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
          fi
          swapon --show
          free -h

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          apt-get update
          for i in 1 2 3; do
            apt-get install -y --fix-missing \
              clang cmake pkg-config \
              libgtk-4-dev libclang-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              libgstreamer-plugins-bad1.0-dev \
              gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
              libpipewire-0.3-dev libtesseract-dev \
              libxkbcommon-dev libx11-dev libxtst-dev libwayland-dev libdbus-1-dev \
              meson ninja-build gobject-introspection valac \
              qtbase5-dev libqt5x11extras5-dev && break
            echo "apt-get install attempt $i failed, retrying..."
            sleep 10
            apt-get update
          done
          # Fail if the loop exhausted all retries without breaking
          dpkg -l libgtk-4-dev cmake clang > /dev/null 2>&1 || (echo "ERROR: Required packages not installed" && exit 1)

      - name: Build gtk4-layer-shell from source
        run: |
          git clone --depth 1 --branch "${GTK4_LAYER_SHELL_TAG}" \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr
          ninja -C build install
          ldconfig

      - name: Install cargo-deb
        run: cargo install cargo-deb --version "${CARGO_DEB_VERSION}"

      - name: Build release binaries
        run: cargo build --release --verbose

      - name: Stage capture helper for Debian packaging
        run: |
          mkdir -p packaging/deb
          cp target/release/apexshot-capture packaging/deb/apexshot-capture

      - name: Verify staged capture helper matches release build
        run: cmp target/release/apexshot-capture packaging/deb/apexshot-capture

      - name: Build .deb package
        run: scripts/package-deb.sh --no-build --verbose

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package GNOME extension
        run: |
          cd gnome-extension
          zip apexshot-gnome-integration.zip \
            extension.js metadata.json \
            cursor-classifier.js press-tracker.js shell-overlay.js window-list.js preview-stacking.js daemon-ownership.js

      - name: Upload Debian and GNOME build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-gnome
          path: |
            target/debian/*.deb
            gnome-extension/apexshot-gnome-integration.zip
          if-no-files-found: error
          retention-days: 90

  opensuse:
    name: Build openSUSE RPM package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, ci, studio_release_config, release]
    container:
      image: opensuse/tumbleweed
      env:
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
    env:
      APEXSHOT_STUDIO_VERIFY_KEY: ${{ needs.studio_release_config.outputs.verify_key }}
      APEXSHOT_STUDIO_RELEASE_TIMESTAMP: ${{ needs.studio_release_config.outputs.release_timestamp }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            cargo \
            rust \
            git \
            cmake \
            clang \
            pkgconf-pkg-config \
            gtk4-devel \
            gtk4-layer-shell-devel \
            libadwaita-devel \
            dbus-1-devel \
            pipewire-devel \
            libQt5Core-devel \
            libQt5DBus-devel \
            libQt5Network-devel \
            libQt5Widgets-devel \
            libqt5-qtx11extras-devel \
            libXtst-devel \
            tesseract-ocr-devel \
            libcurl-devel \
            gstreamer-devel \
            gstreamer-plugins-base-devel \
            rpm-build \
            fdupes \
            update-desktop-files \
            hicolor-icon-theme
          cargo --version
          rpmbuild --version

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build openSUSE RPMs
        run: scripts/build-opensuse-rpm.sh "${{ steps.get_version.outputs.VERSION }}"

      - name: Upload openSUSE RPM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-rpms
          path: |
            target/opensuse-rpmbuild/RPMS/*/*.rpm
            target/opensuse-rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 90

  fedora:
    name: Build Fedora RPM package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, ci, studio_release_config, release]
    container:
      image: fedora:42
      env:
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
    env:
      APEXSHOT_STUDIO_VERIFY_KEY: ${{ needs.studio_release_config.outputs.verify_key }}
      APEXSHOT_STUDIO_RELEASE_TIMESTAMP: ${{ needs.studio_release_config.outputs.release_timestamp }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            cargo \
            rust \
            git \
            cmake \
            clang \
            pkgconf-pkg-config \
            gtk4-devel \
            gtk4-layer-shell-devel \
            libadwaita-devel \
            dbus-devel \
            pipewire-devel \
            qt5-qtbase-devel \
            qt5-qtx11extras-devel \
            libXtst-devel \
            tesseract-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            rpm-build \
            desktop-file-utils \
            hicolor-icon-theme
          cargo --version
          rpmbuild --version

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Fedora RPMs
        run: scripts/build-fedora-rpm.sh "${{ steps.get_version.outputs.VERSION }}"

      - name: Upload Fedora RPM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpms
          path: |
            target/fedora-rpmbuild/RPMS/*/*.rpm
            target/fedora-rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 90

  arch:
    name: Build Arch Linux package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, ci, studio_release_config]
    container:
      image: archlinux:latest
    permissions:
      contents: read
    env:
      APEXSHOT_STUDIO_VERIFY_KEY: ${{ needs.studio_release_config.outputs.verify_key }}
      APEXSHOT_STUDIO_RELEASE_TIMESTAMP: ${{ needs.studio_release_config.outputs.release_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            rust \
            git \
            cmake \
            clang \
            pkgconf \
            gtk4 \
            libadwaita \
            gtk4-layer-shell \
            gst-plugins-base \
            gst-plugins-good \
            gst-plugins-bad \
            gst-libav \
            pipewire \
            pipewire-pulse \
            tesseract \
            tesseract-data-eng \
            qt5-base \
            qt5-x11extras \
            libxtst \
            wl-clipboard \
            libnotify \
            xdg-utils \
            ffmpeg \
            wget \
            curl \
            unzip \
            sudo
          which cargo && cargo --version

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version from tag
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKGVER="${VERSION#v}"
          ARCHIVE="apexshot-${PKGVER}.tar.gz"
          SOURCE_URL="https://github.com/apex-shot/apexshot/archive/${VERSION}.tar.gz"

          # Download the release tarball and compute its SHA-256
          curl -fsSL "${SOURCE_URL}" -o "/tmp/${ARCHIVE}"
          SHA256="$(sha256sum "/tmp/${ARCHIVE}" | awk '{print $1}')"

          cd packaging/arch
          sed -i \
            -e "s/^pkgver=.*/pkgver=${PKGVER}/" \
            -e "s#^source=.*#source=(\"${ARCHIVE}::${SOURCE_URL}\")#" \
            -e "s/^sha256sums=.*/sha256sums=('${SHA256}')/" \
            PKGBUILD

          echo "Updated PKGBUILD to pkgver=${PKGVER}"
          echo "source=${SOURCE_URL}"
          echo "sha256sums=${SHA256}"

      - name: Build package with makepkg
        run: |
          cd packaging/arch
          # makepkg refuses to run as root; use a build user
          useradd -m builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builduser:builduser /__w/apexshot/apexshot
          sudo -u builduser env \
            APEXSHOT_STUDIO_VERIFY_KEY="$APEXSHOT_STUDIO_VERIFY_KEY" \
            APEXSHOT_STUDIO_RELEASE_TIMESTAMP="$APEXSHOT_STUDIO_RELEASE_TIMESTAMP" \
            makepkg -sf --noconfirm

      - name: Upload Arch package build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 90

  stage_release:
    name: Stage complete draft release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: stable-release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    needs: [studio_release_config, release, fedora, opensuse, arch]
    env:
      APEXSHOT_STUDIO_VERIFY_KEY: ${{ needs.studio_release_config.outputs.verify_key }}
      APEXSHOT_STUDIO_RELEASE_TIMESTAMP: ${{ needs.studio_release_config.outputs.release_timestamp }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: Validate, assemble, and checksum the full release set
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$GITHUB_SHA" ]; then
            echo "Checked-out source does not match the tagged workflow commit." >&2
            exit 1
          fi
          python3 scripts/release_gate.py prepare-assets \
            build-artifacts staged-assets \
            "${GITHUB_REF_NAME}" \
            "$APEXSHOT_STUDIO_VERIFY_KEY" \
            "${APEXSHOT_STUDIO_RELEASE_TIMESTAMP}" \
            "$source_commit"

      - name: Create or refresh the unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          assets=(staged-assets/*)
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo "Refusing to overwrite an already published release." >&2
              exit 1
            fi
            while IFS= read -r name; do
              [ -n "$name" ] && gh release delete-asset "$tag" "$name" --repo "$repo" --yes
            done < <(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')
            gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$repo" \
              --title "ApexShot $tag" \
              --generate-notes \
              --draft \
              --verify-tag
          fi
