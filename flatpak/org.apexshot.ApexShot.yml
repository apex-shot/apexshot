# ApexShot portal-only Flatpak (plan §10.4)
#
# Local dev build (needs network for crates on first run):
#   flatpak-builder --user --install --force-clean build-dir \
#     flatpak/org.apexshot.ApexShot.yml
#
# Flathub submission must replace the dir source with a tagged archive +
# generated cargo-sources.json (see flatpak/README.md). Never request
# --filesystem=host.

id: org.apexshot.ApexShot
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: apexshot

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Cloud upload + OCR model download (ocrs)
  - --share=network
  # Screen recording audio
  - --socket=pulseaudio
  # Default save locations (FileChooser portal covers anything else)
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  # Tray
  - --talk-name=org.kde.StatusNotifierWatcher
  # Notifications (also covered by portal; keep for older hosts)
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    CARGO_HOME: /run/build/apexshot/cargo
    RUST_BACKTRACE: '1'

modules:
  # Layer-shell for wlroots overlay paths (no-op on GNOME; harmless).
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.0.3.tar.gz
        sha256: 4d669c30b3dbc68ad69ade9752e6ebbe7be132db21a5a4734d42bc09c5481c34

  - name: apexshot
    buildsystem: simple
    build-options:
      env:
        # bindgen / pipewire-sys
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
    build-commands:
      # Local/dir builds may use the network. Flathub builds must switch to
      # `cargo --offline` + cargo-sources.json (see README).
      - cargo fetch --manifest-path Cargo.toml --verbose
      - cargo build --release --locked --no-default-features --features flatpak --verbose
      - install -Dm755 ./target/release/apexshot /app/bin/apexshot
      - install -Dm644 flatpak/org.apexshot.ApexShot.desktop /app/share/applications/org.apexshot.ApexShot.desktop
      - install -Dm644 flatpak/org.apexshot.ApexShot.metainfo.xml /app/share/metainfo/org.apexshot.ApexShot.metainfo.xml
      - install -Dm644 packaging/apexshot.svg /app/share/icons/hicolor/scalable/apps/org.apexshot.ApexShot.svg
    sources:
      # Development: build the working tree. For Flathub, replace with:
      #   type: archive + sha256 of a release tag, plus cargo-sources.json
      - type: dir
        path: ..
