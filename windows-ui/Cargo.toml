[package]
name = "apexshot-windows-settings"
version = "0.2.36"
edition = "2021"
description = "GTK4 settings window for the Windows build of ApexShot"
license = "GPL-3.0-or-later"
repository = "https://github.com/apex-shot/apexshot"

[lib]
name = "apexshot_settings"
path = "src/lib.rs"

[[bin]]
name = "apexshot-settings"
path = "src/main.rs"

[[bin]]
name = "apexshot-history"
path = "src/bin/apexshot-history.rs"

[[bin]]
name = "apexshot-video-editor"
path = "src/bin/apexshot-video-editor.rs"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
relm4-icons = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }
async-channel = "2.5.0"
anyhow = "1.0"
dirs = "6.0"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = "0.4"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
pango = { version = "0.21", features = ["v1_56"] }
pangocairo = "0.21"
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
relm4-icons-build = "0.10.1"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
flatpak = []

# The editor composites frames itself on export (crop, scale, ripple warp,
# cursor), so an unoptimized build turns a few minutes of video into an
# hour. Optimize this package in dev without rebuilding every dependency.
[profile.dev.package.apexshot-windows-settings]
opt-level = 2
